apiVersion: apps/v1
kind: Deployment
metadata:
  name: posts-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: posts
  template:
    metadata:
      labels:
        app: posts
    spec:
      containers:
        - name: posts
          image: phoelapyae197575/posts
          imagePullPolicy: IfNotPresent
          env:
            - name: EVENT_BUS_URL
              value: http://event-bus-svc:4005
---
apiVersion: v1
kind: Service
metadata:
  name: posts-clusterip-svc
spec:
  selector:
    app: posts
  ports:  
    - name: posts
      protocol: TCP
      port: 4000
      targetPort: 4000